<!doctype html><html lang="ko"><meta charset="utf-8"><title>릴트립 수수료 정책</title><link rel="stylesheet" href="../src/assets/docs.css"><main class="docmain"><h1>현금 직접 지급 · 매칭 수수료 10%</h1><p>여행자는 현장에서 메이트에게 여행비를 직접 지급하고 메이트는 예약 확정 전 여행비의 10%를 플랫폼에 결제한다. 플랫폼은 여행비를 수납·송금하지 않는다.</p><p><a href="mvp-policy.html">취소·반환·노쇼·CS 최신 운영 정책</a></p><p>실제 PG 결제·환불은 미연결이며 세금·VAT 처리는 별도 확정한다.</p></main></html>
