<link rel="stylesheet" href="../src/assets/design-system.css">
<style>
.notification-document{--preview-border:#dde0e3;max-width:980px;margin:auto}
.notification-document .notification-tabs{display:flex;flex-wrap:wrap;gap:24px;border-bottom:1px solid var(--preview-border);margin:24px 0}
.notification-document .notification-tabs button{font:inherit;font-weight:600;color:#626970;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px;cursor:pointer;min-height:48px}
.notification-document .notification-tabs button[aria-selected=true]{color:#245fe0;border-bottom-color:#245fe0}
.notification-document button:focus-visible,.notification-document select:focus-visible{outline:3px solid #245fe0;outline-offset:3px}
.notification-document [hidden]{display:none!important}
.notification-document .notification-layout{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:32px;align-items:start}
.notification-document .notification-frame{display:block;width:100%;height:740px;border:1px solid var(--preview-border);border-radius:24px;background:#f6f7f8;box-sizing:border-box}
.notification-document .notification-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.notification-document select{font:inherit;max-width:100%;padding:10px;border:1px solid var(--preview-border);border-radius:8px;background:white}
.notification-document .notification-notes h3{margin-top:0}
.notification-document .notification-notes p,.notification-document .notification-notes li{line-height:1.7}
.notification-document .notification-meta{color:#626970;font-size:13px}
.notification-policy-table-wrap{overflow-x:auto;margin:20px 0}
.notification-document .notification-table{width:100%;border-collapse:collapse;font-size:14px}
.notification-document .notification-table th,.notification-document .notification-table td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--preview-border);vertical-align:top}
.notification-document .notification-table th{background:#f6f7f8}
.notification-role-filter{margin:20px 0 12px}.notification-message-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.notification-document .notification-intro{font-size:16px;line-height:1.7;margin:0 0 16px}.notification-document .notification-usage{font-size:14px;color:var(--rt-muted);line-height:1.7;margin:0 0 20px}.notification-document .notification-guide{margin:0 0 20px;font-size:14px;line-height:1.7}.notification-document summary{cursor:pointer}.notification-document summary:focus-visible{outline:3px solid var(--rt-primary);outline-offset:4px}.notification-document #notification-copy-panel>h2{font-size:24px;margin:0 0 8px}.notification-document #notification-role-count{margin:0 0 16px;font-size:14px}
@media(max-width:720px){.notification-message-grid{grid-template-columns:minmax(0,1fr)}.notification-document .notification-layout{grid-template-columns:minmax(0,1fr)}.notification-document .notification-frame{max-width:430px;margin:auto;height:680px}.notification-document .notification-table th,.notification-document .notification-table td{padding:10px 6px}}
</style>
<div class="notification-document">
<p class="notification-intro">누가, 어떤 상황에서, 어떤 알림을 받는지 확인하세요.</p>
<div class="notification-tabs" role="tablist" aria-label="알림 문서">
<button id="notification-copy-tab" role="tab" aria-selected="true" aria-controls="notification-copy-panel" tabindex="0">메시지별 문구</button>
<button id="notification-rules-tab" role="tab" aria-selected="false" aria-controls="notification-rules-panel" tabindex="-1">발송 기준</button>
</div>
<section id="notification-copy-panel" role="tabpanel" aria-labelledby="notification-copy-tab">
<h2>수신자별 알림</h2>
<p class="notification-usage">카드에는 실제 목록처럼 2줄까지 표시합니다. 각 알림 아래에서 발송 시점과 수신 조건을 확인하세요. 문구는 한 벌만 사용합니다. 생략된 내용은 ‘문구 확인’에서 볼 수 있어요.</p>
<p class="notification-usage"><strong>여행자·메이트 알림 12종.</strong> 선택·취소 등 본인이 한 행동과 단순 종료는 해당 화면에서 확인합니다. 서비스 알림은 알림함에 표시합니다. 현재 서버 알림·푸시는 미연결입니다.</p><p class="notification-usage">새 제안·예약 변경은 즉시 알림함에 기록합니다. 채팅은 미읽음 표시만 사용합니다.</p>
<div class="ds-preview notification-role-filter"><div class="rt-filter-chips" role="group" aria-label="알림 수신자"><button type="button" class="rt-filter-chip" data-recipient-filter="traveler" aria-pressed="true">여행자</button><button type="button" class="rt-filter-chip" data-recipient-filter="mate" aria-pressed="false">메이트</button><button type="button" class="rt-filter-chip" data-recipient-filter="all" aria-pressed="false">전체</button></div></div>
<p id="notification-role-count" class="notification-meta" role="status" aria-live="polite"></p>
<!-- notification-message-catalog -->
</section>
<section id="notification-rules-panel" role="tabpanel" aria-labelledby="notification-rules-tab" hidden tabindex="0">
<!-- notification-policy-content -->
</section>
</div>
<script>
(()=>{
 const filters=[...document.querySelectorAll('[data-recipient-filter]')],cards=[...document.querySelectorAll('.notification-message')];
 const names={traveler:'여행자',mate:'메이트',all:'전체'};
 function filterRecipient(role){let count=0;for(const card of cards){const visible=role==='all'||card.dataset.recipients.split(' ').includes(role);card.hidden=!visible;if(visible)count++;}for(const button of filters)button.setAttribute('aria-pressed',String(button.dataset.recipientFilter===role));document.getElementById('notification-role-count').textContent=names[role]+' 알림 '+count+'개';}
 for(const button of filters){const role=button.dataset.recipientFilter;const count=cards.filter(card=>role==='all'||card.dataset.recipients.split(' ').includes(role)).length;button.textContent=names[role]+' '+count;button.addEventListener('click',()=>filterRecipient(role));}
 filterRecipient('traveler');
 const tabs=[...document.querySelectorAll('.notification-tabs [role=tab]')];
 function selectTab(tab){for(const item of tabs){const selected=item===tab;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1;document.getElementById(item.getAttribute('aria-controls')).hidden=!selected;}}
 tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>selectTab(tab));tab.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();selectTab(tabs[next]);tabs[next].focus();});});
})();
</script>
